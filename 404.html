<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect fix
      (function() {
        var l = window.location;
        var repo = "/food-order-app"; // <-- your repo name here
        var path = l.pathname.replace(repo, "");
        var newUrl = repo + "/index.html?redirect=" + encodeURIComponent(path + l.search + l.hash);
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
